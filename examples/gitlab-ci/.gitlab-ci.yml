# Set COMMUNIQUE_IMAGE to an image containing communique and git.
# Set OPENAI_BASE_URL, OPENAI_API_KEY and LLM_MODEL as CI variables.
# For a corporate GitLab CA, set COMMUNIQUE_CA_CERT to a GitLab file variable.
# Optionally set GITLAB_TOKEN as a masked, protected variable with API access.
default:
  image: $COMMUNIQUE_IMAGE

variables:
  GIT_DEPTH: "0"

release_notes_preview:
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - communique generate --provider openai --model "$LLM_MODEL" --dry-run --output release-notes.md
  artifacts:
    paths:
      - release-notes.md

release_notes_publish:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  script:
    - communique generate --provider openai --model "$LLM_MODEL" --gitlab-release
